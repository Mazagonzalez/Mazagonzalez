  <title id="title">Carlos Maza — Frontend Developer</title>
  <desc id="desc">I build fast, accessible interfaces for the web. Astro, React, Tailwind, Laravel.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.783" cy="0.495" r=".45">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".30"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx=".32" cy=".28" r=".85">
      <stop offset="0" stop-color="#ddd6fe"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".75" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#21262d"/>
    </pattern>
    <mask id="dotMask"><rect width="1200" height="380" fill="url(#fadeL)"/></mask>
    <clipPath id="card"><rect width="1200" height="380" rx="18"/></clipPath>
    <clipPath id="front"><rect x="0" y="188" width="1200" height="380"/></clipPath>
    <clipPath id="back"><rect x="0" y="0" width="1200" height="188"/></clipPath>
  </defs>
  <style>
    .tw{animation:tw 4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .orbit{transform-box:view-box;transform-origin:940px 188px;transform:rotate(-14deg)}
    .float{animation:float 7s ease-in-out infinite;transform-box:view-box}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

